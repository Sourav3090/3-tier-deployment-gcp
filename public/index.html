<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<div class="header">

<h1><i class="fa-solid fa-user-graduate"></i> Student Management Dashboard</h1>

<p>Node.js • Express • MongoDB Atlas • Google Cloud Platform</p>

</div>

<div class="stats">

<div class="stat-box">

<h3>Total Students</h3>

<h1 id="totalStudents">0</h1>

</div>

<div class="stat-box">

<h3>Database</h3>

<h1 class="badge">Online</h1>

</div>

<div class="stat-box">

<h3>Server</h3>

<h1 class="badge">Running</h1>

</div>

</div>

<div class="row">

<div class="card form-card">

<h2><i class="fa-solid fa-user-plus"></i> Add Student</h2>

<form id="studentForm">

<div class="form-group">

<label>Name</label>

<input
type="text"
id="name"
class="form-control"
placeholder="Enter Student Name"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter Student Email"
required>

</div>

<button class="btn btn-save" id="saveBtn" type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Save Student

</button>

</form>

</div>

<div class="card table-card">

<h2><i class="fa-solid fa-users"></i> Student Records</h2>

<input
type="text"
id="search"
class="search-box"
placeholder="🔍 Search Student...">

<table>

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="users">

</tbody>

</table>

</div>

</div>

<div class="footer">

<h5>Powered By Node.js • Express • MongoDB Atlas • Google Cloud</h5>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
